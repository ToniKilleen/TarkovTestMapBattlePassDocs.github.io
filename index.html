<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarkov Interactive Maps</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- HEADER -->
    <header id="header">
        <div class="header-left">
            <div class="logo">
                <span class="logo-icon">⚔</span>
                <div class="logo-text">
                    <h1>TARKOV</h1>
                    <span class="logo-sub">INTERACTIVE MAPS</span>
                </div>
            </div>
        </div>
        <div class="header-center">
            <div id="map-selector" class="map-tabs"></div>
        </div>
        <div class="header-right">
            <button id="btn-admin-toggle" class="admin-toggle" title="Режим редактирования">🔒</button>
        </div>
    </header>

    <!-- FILTER PANEL -->
    <aside id="filter-panel" class="filter-panel">
        <div class="filter-header">
            <h3>ФИЛЬТРЫ</h3>
            <button id="btn-toggle-all" class="btn-mini" title="Вкл/Выкл все">👁</button>
        </div>
        <div class="filter-group">
            <label class="filter-item">
                <input type="checkbox" data-category="findocs" checked>
                <span class="filter-icon" style="background:#f1c40f">📃</span>
                <span class="filter-label">Финансовая</span>
                <span class="filter-count" id="count-findocs">0</span>
            </label>
            <label class="filter-item">
                <input type="checkbox" data-category="lpihvk" checked>
                <span class="filter-icon" style="background:#3498db">📋</span>
                <span class="filter-label">Личные ЧВК</span>
                <span class="filter-count" id="count-lpihvk">0</span>
            </label>
            <label class="filter-item">
                <input type="checkbox" data-category="proectdocs" checked>
                <span class="filter-icon" style="background:#2ecc71">📐</span>
                <span class="filter-label">Проектная</span>
                <span class="filter-count" id="count-proectdocs">0</span>
            </label>
            <label class="filter-item">
                <input type="checkbox" data-category="texdocs" checked>
                <span class="filter-icon" style="background:#e67e22">📏</span>
                <span class="filter-label">Чертежи и тех.</span>
                <span class="filter-count" id="count-texdocs">0</span>
            </label>
            <label class="filter-item">
                <input type="checkbox" data-category="testdocs" checked>
                <span class="filter-icon" style="background:#9b59b6">🧪</span>
                <span class="filter-label">Тестовая</span>
                <span class="filter-count" id="count-testdocs">0</span>
            </label>
            <label class="filter-item">
                <input type="checkbox" data-category="polsdocs" checked>
                <span class="filter-icon" style="background:#1abc9c">📖</span>
                <span class="filter-label">Пользовательская</span>
                <span class="filter-count" id="count-polsdocs">0</span>
            </label>
            <label class="filter-item">
                <input type="checkbox" data-category="meddocs" checked>
                <span class="filter-icon" style="background:#e91e63">💊</span>
                <span class="filter-label">Медицинская</span>
                <span class="filter-count" id="count-meddocs">0</span>
            </label>
            <label class="filter-item">
                <input type="checkbox" data-category="expdocs" checked>
                <span class="filter-icon" style="background:#ff9800">🔧</span>
                <span class="filter-label">Эксплуатационная</span>
                <span class="filter-count" id="count-expdocs">0</span>
            </label>
            <label class="filter-item">
                <input type="checkbox" data-category="secretdocs" checked>
                <span class="filter-icon" style="background:#e74c3c">🔒</span>
                <span class="filter-label">Секретная</span>
                <span class="filter-count" id="count-secretdocs">0</span>
            </label>
        </div>
        <div id="admin-tools" class="admin-tools hidden">
            <div class="admin-divider"><span>РЕДАКТИРОВАНИЕ</span></div>
            <button id="btn-add-marker" class="btn-action btn-primary"><span class="btn-icon">+</span> Добавить точку</button>
            <button id="btn-export" class="btn-action btn-ghost">📥 Экспорт JSON</button>
            <button id="btn-import" class="btn-action btn-ghost">📤 Импорт JSON</button>
            <input type="file" id="import-file" accept=".json" style="display:none">
        </div>
        <div class="filter-footer">
            <div class="coords-display">
                <span class="coords-label">КУРСОР</span>
                <span id="cursor-coords" class="coords-value">—</span>
            </div>
        </div>
    </aside>

    <!-- MAP -->
    <div id="map-container">
        <div id="map"></div>
    </div>

    <!-- HINT -->
    <div id="adding-hint" class="adding-hint hidden">📍 КЛИКНИТЕ ПО КАРТЕ ЧТОБЫ ПОСТАВИТЬ ТОЧКУ</div>

    <!-- MARKER FORM PANEL -->
    <div id="marker-form-panel" class="marker-form-panel hidden">
        <div class="marker-form-header">
            <h3 id="form-panel-title">ДОБАВИТЬ ТОЧКУ</h3>
            <button id="btn-close-form" class="close-btn">&times;</button>
        </div>
        <div class="marker-form-body">
            <form id="marker-form">
                <div class="form-group">
                    <label for="form-name">Название</label>
                    <input type="text" id="form-name" required placeholder="Документ на столе">
                </div>
                <div class="form-group">
                    <label for="form-category">Категория</label>
                    <select id="form-category">
                        <option value="findocs">📃 Финансовая документация</option>
                        <option value="lpihvk">📋 Личные данные ЧВК</option>
                        <option value="proectdocs">📐 Проектная документация</option>
                        <option value="texdocs">📏 Чертежи и тех. документация</option>
                        <option value="testdocs">🧪 Тестовая документация</option>
                        <option value="polsdocs">📖 Пользовательская документация</option>
                        <option value="meddocs">💊 Медицинская документация</option>
                        <option value="expdocs">🔧 Эксплуатационная документация</option>
                        <option value="secretdocs">🔒 Секретная документация</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="form-description">Описание</label>
                    <textarea id="form-description" rows="3" placeholder="Лежит на столе в правом углу..."></textarea>
                </div>
                <div class="form-group">
                    <label for="form-screenshot">Скриншот (URL)</label>
                    <input type="text" id="form-screenshot" placeholder="images/screenshots/example.jpg">
                </div>
                <div class="form-coords-box" id="form-coords-hint">
                    <span class="coords-icon">📍</span>
                    <span class="coords-text">Нажмите на карту</span>
                </div>
                <input type="hidden" id="form-lat">
                <input type="hidden" id="form-lng">
                <input type="hidden" id="form-id">
                <div class="form-buttons">
                    <button type="button" id="btn-cancel-form" class="btn-action btn-ghost">Отмена</button>
                    <button type="submit" class="btn-action btn-primary">💾 Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- INFO PANEL -->
    <aside id="info-panel" class="info-panel hidden">
        <button id="close-info" class="close-btn">&times;</button>
        <div id="info-content">
            <div id="info-screenshot-wrap">
                <img id="info-image" src="" alt="Screenshot">
                <div id="info-no-image" class="no-image">📷 Нет скриншота</div>
            </div>
            <div class="info-body">
                <div id="info-category" class="info-badge">—</div>
                <h2 id="info-title">—</h2>
                <div id="info-description"><p id="info-text">Нажмите на точку на карте</p></div>
                <div id="info-meta">
                    <div class="meta-row"><span class="meta-label">Координаты</span><span id="info-coords" class="meta-value">—</span></div>
                    <div class="meta-row"><span class="meta-label">Карта</span><span id="info-map-name" class="meta-value">—</span></div>
                </div>
                <div id="info-actions" class="hidden">
                    <button id="btn-edit-marker" class="btn-action btn-ghost">✏️ Редактировать</button>
                    <button id="btn-delete-marker" class="btn-action btn-danger">🗑️ Удалить</button>
                </div>
            </div>
        </div>
    </aside>

    <!-- ADMIN LOGIN -->
    <div id="admin-modal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>Режим редактирования</h2>
                <button id="btn-close-admin-modal" class="close-btn">&times;</button>
            </div>
            <form id="admin-form">
                <div class="form-group">
                    <label for="admin-password">Пароль</label>
                    <input type="password" id="admin-password" required placeholder="Введите пароль">
                </div>
                <p id="admin-error" class="form-error hidden">Неверный пароль</p>
                <div class="modal-buttons">
                    <button type="button" id="btn-cancel-admin" class="btn-action btn-ghost">Отмена</button>
                    <button type="submit" class="btn-action btn-primary">🔓 Войти</button>
                </div>
            </form>
        </div>
    </div>

    <!-- NOTIFICATION -->
    <div id="notification" class="notification hidden">
        <span id="notification-text"></span>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/maps-config.js"></script>
    <script src="js/markers-data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
