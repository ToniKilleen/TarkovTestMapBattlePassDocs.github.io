<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarkov Interactive Maps</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header id="header">
        <div class="header-left">
            <h1>TARKOV MAPS</h1>
            <span class="version">v0.15</span>
        </div>
        <div class="header-center">
            <div id="map-selector" class="map-tabs"></div>
        </div>
    </header>

    <!-- ===== FILTER PANEL ===== -->
    <aside id="filter-panel" class="filter-panel">
        <h3>ФИЛЬТРЫ</h3>
        <div class="filter-group">
            <label><input type="checkbox" data-category="loot" checked> 💰 Лут</label>
            <label><input type="checkbox" data-category="key" checked> 🔑 Ключи</label>
            <label><input type="checkbox" data-category="extract" checked> 🚪 Выходы</label>
            <label><input type="checkbox" data-category="boss" checked> 💀 Боссы</label>
            <label><input type="checkbox" data-category="medical" checked> 💊 Медицина</label>
            <label><input type="checkbox" data-category="weapon" checked> 🔫 Оружие</label>
            <label><input type="checkbox" data-category="quest" checked> 📋 Квесты</label>
        </div>
        <hr>
        <button id="btn-add-marker" class="btn-action">+ Добавить точку</button>
        <button id="btn-export" class="btn-action btn-secondary">📥 Экспорт JSON</button>
        <button id="btn-import" class="btn-action btn-secondary">📤 Импорт JSON</button>
        <input type="file" id="import-file" accept=".json" style="display:none">
    </aside>

    <!-- ===== MAP CONTAINER ===== -->
    <div id="map-container">
        <div id="map"></div>
    </div>

    <!-- ===== INFO PANEL (Right Side) ===== -->
    <aside id="info-panel" class="info-panel hidden">
        <button id="close-info" class="close-btn">&times;</button>
        <div id="info-content">
            <h2 id="info-title">—</h2>
            <div id="info-category" class="info-badge">—</div>
            <div id="info-screenshot">
                <img id="info-image" src="" alt="Screenshot">
            </div>
            <div id="info-description">
                <p id="info-text">Нажмите на точку на карте</p>
            </div>
            <div id="info-meta">
                <p><strong>Координаты:</strong> <span id="info-coords">—</span></p>
            </div>
            <div id="info-actions">
                <button id="btn-edit-marker" class="btn-action">✏️ Редактировать</button>
                <button id="btn-delete-marker" class="btn-action btn-danger">🗑️ Удалить</button>
            </div>
        </div>
    </aside>

    <!-- ===== MODAL: Add/Edit Marker ===== -->
    <div id="marker-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modal-title">Добавить точку</h2>
            <form id="marker-form">
                <label>Название:
                    <input type="text" id="form-name" required placeholder="LEDX на столе">
                </label>

                <label>Категория:
                    <select id="form-category">
                        <option value="loot">💰 Лут</option>
                        <option value="key">🔑 Ключ</option>
                        <option value="extract">🚪 Выход</option>
                        <option value="boss">💀 Босс</option>
                        <option value="medical">💊 Медицина</option>
                        <option value="weapon">🔫 Оружие</option>
                        <option value="quest">📋 Квест</option>
                    </select>
                </label>

                <label>Описание:
                    <textarea id="form-description" rows="4" placeholder="Лежит на столе в правом углу комнаты..."></textarea>
                </label>

                <label>Скриншот (URL или путь):
                    <input type="text" id="form-screenshot" placeholder="images/screenshots/lab_ledx_01.jpg">
                </label>

                <p class="form-hint" id="form-coords-hint">Координаты: нажмите на карту</p>
                <input type="hidden" id="form-lat">
                <input type="hidden" id="form-lng">
                <input type="hidden" id="form-id">

                <div class="modal-buttons">
                    <button type="submit" class="btn-action">💾 Сохранить</button>
                    <button type="button" id="btn-cancel-modal" class="btn-action btn-secondary">Отмена</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/maps-config.js"></script>
    <script src="js/markers-data.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
